<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="300" height="120" viewBox="0 0 300 120">
  <defs>
    <style>
      @keyframes countUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes shimmer {
        0% { opacity: 0.6; }
        50% { opacity: 1; }
        100% { opacity: 0.6; }
      }
      .bg { fill: #ffffff; rx: 12; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #555555; text-transform: uppercase; letter-spacing: 0.05em; }
      .number { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 42px; font-weight: 700; fill: #16a34a; }
      .month { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #555555; opacity: 0.7; }
      .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #555555; }
      .dot { fill: #16a34a; animation: shimmer 2s ease-in-out infinite; }
      .count-anim { animation: countUp 0.8s ease-out forwards; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="300" height="120" />

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="120" fill="#16a34a" />

  <!-- Content -->
  <text class="title" x="20" y="28">Commits this month</text>
  <text class="number count-anim" x="20" y="78">171</text>
  <text class="month" x="20" y="100">August 2026</text>

  <!-- Animated dot indicator -->
  <circle class="dot" cx="260" cy="30" r="5" />

  <!-- Total all-time -->
  <text class="label" x="170" y="52" text-anchor="middle">All-time</text>
  <text class="number" x="170" y="85" style="font-size:24px;" fill="#555555">4,517</text>
</svg>