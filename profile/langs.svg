<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="495" height="220" viewBox="0 0 495 220" role="img" aria-label="Top Languages">
  <defs>
    <style>
      .root { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .title { font-size: 14px; font-weight: 700; fill: #111827; }
      .lang  { font-size: 12px; font-weight: 500; fill: #374151; }
      .pct   { font-size: 11px; font-weight: 600; fill: #6b7280; font-variant-numeric: tabular-nums; }
    </style>
  </defs>

  <!-- Card background -->
  <rect width="495" height="220" fill="#ffffff" rx="12"/>

  <!-- Title -->
  <text x="20" y="30" class="root title">Top Languages</text>
  <line x1="20" y1="44" x2="475" y2="44" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Row 1: TypeScript 38% -->
  <text x="20" y="66" class="root lang">TypeScript</text>
  <text x="475" y="66" class="root pct" text-anchor="end">38%</text>
  <rect x="20" y="72" width="455" height="10" fill="#e5e7eb" rx="5"/>
  <rect x="20" y="72" width="0" height="10" fill="#3178c6" rx="5" data-bar="173" data-delay="0">
    <animate attributeName="width" from="0" to="173" dur="0.7s" begin="0s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
  </rect>

  <!-- Row 2: JavaScript 24% -->
  <text x="20" y="98" class="root lang">JavaScript</text>
  <text x="475" y="98" class="root pct" text-anchor="end">24%</text>
  <rect x="20" y="104" width="455" height="10" fill="#e5e7eb" rx="5"/>
  <rect x="20" y="104" width="0" height="10" fill="#f1e05a" rx="5" data-bar="109" data-delay="0.1">
    <animate attributeName="width" from="0" to="109" dur="0.7s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
  </rect>

  <!-- Row 3: Python 18% -->
  <text x="20" y="130" class="root lang">Python</text>
  <text x="475" y="130" class="root pct" text-anchor="end">18%</text>
  <rect x="20" y="136" width="455" height="10" fill="#e5e7eb" rx="5"/>
  <rect x="20" y="136" width="0" height="10" fill="#3572A5" rx="5" data-bar="82" data-delay="0.2">
    <animate attributeName="width" from="0" to="82" dur="0.7s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
  </rect>

  <!-- Row 4: SQL 12% -->
  <text x="20" y="162" class="root lang">SQL</text>
  <text x="475" y="162" class="root pct" text-anchor="end">12%</text>
  <rect x="20" y="168" width="455" height="10" fill="#e5e7eb" rx="5"/>
  <rect x="20" y="168" width="0" height="10" fill="#4479A1" rx="5" data-bar="55" data-delay="0.3">
    <animate attributeName="width" from="0" to="55" dur="0.7s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
  </rect>

  <!-- Row 5: Shell 8% -->
  <text x="20" y="194" class="root lang">Shell</text>
  <text x="475" y="194" class="root pct" text-anchor="end">8%</text>
  <rect x="20" y="200" width="455" height="10" fill="#e5e7eb" rx="5"/>
  <rect x="20" y="200" width="0" height="10" fill="#89e051" rx="5" data-bar="36" data-delay="0.4">
    <animate attributeName="width" from="0" to="36" dur="0.7s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
  </rect>

  <!-- Inline script fallback for environments that don't support SMIL -->
  <script type="application/ecmascript"><![CDATA[
    (function(){
      var bars = document.querySelectorAll('[data-bar]');
      if (!bars.length) return;
      bars.forEach(function(b){
        var target = parseFloat(b.getAttribute('data-bar'));
        var delay  = parseFloat(b.getAttribute('data-delay') || '0') * 1000;
        var start  = null;
        var dur    = 700;
        function easeOut(t){ return 1 - Math.pow(1 - t, 3); }
        function step(ts){
          if (start === null) start = ts;
          var p = Math.min(1, (ts - start) / dur);
          b.setAttribute('width', (target * easeOut(p)).toFixed(2));
          if (p < 1) requestAnimationFrame(step);
        }
        setTimeout(function(){ requestAnimationFrame(step); }, delay);
      });
    })();
  ]]></script>
</svg>
