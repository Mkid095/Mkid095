  <!-- countUp animation -->
  <script type="application/ecmascript"><![CDATA[
    (function(){
      var targets = {
        't1': 4518, 't2': 0, 't3': 0, 't4': 3,
        't5': 71,  't6': 94, 't7': 7, 't8': 21
      };
      var duration = 700;
      var nodes = document.querySelectorAll('[data-counter]');
      if (!nodes.length) return;
      var start = null;
      function easeOut(t){ return 1 - Math.pow(1 - t, 3); }
      function step(ts){
        if (!start) start = ts;
        var p = Math.min(1, (ts - start) / duration);
        var e = easeOut(p);
        for (var i = 0; i < nodes.length; i++){
          var n = nodes[i];
          var id = n.getAttribute('data-counter');
          var target = targets[id] || 0;
          n.textContent = Math.round(target * e).toLocaleString();
        }
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    })();
  ]]></script>

