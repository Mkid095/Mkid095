<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="300" height="130" viewBox="0 0 300 130">
  <defs><style>
  @keyframes countUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  @keyframes shimmer { 0%,100% { opacity:0.7; } 50% { opacity:1; } }
  @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.15); } }
  @keyframes slideIn { from { opacity:0; transform:translateX(-12px); } to { opacity:1; transform:translateX(0); } }

</style></defs>
  <rect width="300" height="130" fill="#0d1117" rx="8"/>
  <rect width="300" height="130" fill="#0d1117" rx="12"/>
  <rect width="5" height="130" fill="#22c55e" rx="3"/>
  <rect x="0" y="12" width="5" height="116" fill="#22c55e"/>
  <text x="20" y="30" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#22c55e" letter-spacing="1.2">COMMITS THIS MONTH</text>
  <text x="20" y="82" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="800" fill="#22c55e" style="animation:countUp 0.8s ease-out both">0</text>
  <text x="20" y="102" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#9ca3af">August 2026</text>
  <text x="20" y="120" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#9ca3af">All time: 0 commits</text>
  <circle cx="270" cy="30" r="5" fill="#22c55e" style="animation:pulse 2s ease-in-out infinite"/>
</svg>