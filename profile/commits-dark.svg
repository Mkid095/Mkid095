  <script type="application/ecmascript"><![CDATA[
    (function(){
      var nodes = document.querySelectorAll('[data-counter]');
      if (!nodes.length) return;
      var duration = 700;
      var start = null;
      function easeOut(t){ return 1 - Math.pow(1 - t, 3); }
      function step(ts){
        if (!start) start = ts;
        var p = Math.min(1, (ts - start) / duration);
        var e = easeOut(p);
        for (var i = 0; i < nodes.length; i++){
          var n = nodes[i];
          var target = n.getAttribute('data-target') | 0;
          n.textContent = Math.round(target * e).toLocaleString();
        }
        if (p < 1) requestAnimationFrame(step);
      }
      var hero = document.querySelector('[data-counter="hero"]');
      if (hero) hero.setAttribute('data-target', '172');
      requestAnimationFrame(step);
    })();
  ]]></script>
