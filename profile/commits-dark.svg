<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="300" height="120" viewBox="0 0 300 120">
  <defs><style>
  @keyframes countUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  @keyframes shimmer { 0%,100% { opacity:0.7; } 50% { opacity:1; } }
  @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.15); } }
  @keyframes slideIn { from { opacity:0; transform:translateX(-12px); } to { opacity:1; transform:translateX(0); } }

</style></defs>
  <rect width="300" height="120" fill="#0d1117" rx="8"/>
  <text x="20" y="26" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#8b949e" opacity="0.6" letter-spacing="0.05em">COMMITS THIS MONTH</text>
  <text x="20" y="68" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="42" font-weight="800" fill="#22c55e" style="animation:countUp 0.8s ease-out both">0</text>
  <text x="20" y="88" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#8b949e" opacity="0.5">August 2026</text>
  <circle cx="268" cy="28" r="5" fill="#22c55e" style="animation:pulse 2s ease-in-out infinite"/>
  <text x="20" y="112" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#8b949e" opacity="0.4">All time: 0 commits</text>
  <line x1="0" y1="0" x2="0" y2="120" stroke="#22c55e" stroke-width="4" opacity="0.8"/>
</svg>